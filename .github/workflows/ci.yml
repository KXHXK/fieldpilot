name: fieldpilot-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Test backend
        working-directory: backend
        env:
          USE_MOCK_LLM: "true"
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          DATABASE_AUTO_CREATE: "false"
        run: |
          python -m pytest -q
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Smoke live HTTP workflow
        working-directory: backend
        env:
          USE_MOCK_LLM: "true"
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          DATABASE_AUTO_CREATE: "false"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/fieldpilot-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready > /dev/null; then
              break
            fi
            sleep 0.25
          done
          python scripts/smoke_workflow.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run build:showcase
