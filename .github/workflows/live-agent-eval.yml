name: fieldpilot-live-agent-eval

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Repetitions per case
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"

permissions:
  contents: read
  models: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run real-model evaluation
        id: live_eval
        continue-on-error: true
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: https://models.github.ai/inference
          MODEL_NAME: openai/gpt-4.1-mini
          USE_MOCK_LLM: "false"
          LLM_TIMEOUT_SECONDS: "60"
          LLM_TOTAL_TOKENS_LIMIT: "6000"
        run: >-
          python scripts/evaluate_agent.py
          --mode live
          --runs "${{ inputs.runs }}"
          --output artifacts/mission-interpret-live-v1.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-interpret-live-v1
          path: backend/artifacts/mission-interpret-live-v1.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce no-fallback result
        if: steps.live_eval.outcome != 'success'
        run: exit 1
