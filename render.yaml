services:
  - type: web
    name: helloagents-trip-planner-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: HelloAgents Trip Planner
      - key: APP_VERSION
        value: 0.1.0
      - key: USE_MOCK_LLM
        value: false
      - key: USE_MOCK_TOOLS
        value: false
      - key: USE_MOCK_IMAGES
        value: false
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://127.0.0.1:5173","https://kxh-trip-planner.netlify.app"]'
      - key: OPENAI_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: MODEL_NAME
        value: kimi-k2.6
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AMAP_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
